<style>

    --toast-bg:#2B1D14; --toast-ink:#FFF7EE;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161311; --card:#221E1B; --ink:#F3E9DE; --muted:#B3A496; --line:rgba(255,255,255,.12);
      --stage1:#3B342E; --stage2:#1F1B18; --chip:#2D2824; --chip-locked:#24201D; --accent:#F0A055;
      --toast-bg:#FFF7EE; --toast-ink:#2B1D14;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161311; --card:#221E1B; --ink:#F3E9DE; --muted:#B3A496; --line:rgba(255,255,255,.12);
    --stage1:#3B342E; --stage2:#1F1B18; --chip:#2D2824; --chip-locked:#24201D; --accent:#F0A055;
    --toast-bg:#FFF7EE; --toast-ink:#2B1D14;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden;-webkit-text-size-adjust:100%}
  body{font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh;min-height:100dvh}
  .app{width:100%;max-width:460px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:10px;
    padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{margin:0;font-size:26px;line-height:1.1;letter-spacing:.2px}
  .now{margin-top:3px;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now b{color:var(--ink);font-weight:700}
  .icon-btn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);
    display:grid;place-items:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding:0}
  .icon-btn svg{width:22px;height:22px}
  .icon-btn:focus-visible,.chip:focus-visible,.link-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .stage{position:relative;flex:1 1 auto;min-height:380px;max-height:760px;border-radius:28px;overflow:hidden;
    background:radial-gradient(120% 85% at 50% 38%,var(--stage1),var(--stage2));
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    border:1px solid var(--line)}
  @media (hover:hover) and (pointer:fine){ .stage{cursor:none} }
  #ham{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hand{position:absolute;left:0;top:0;width:clamp(72px,24%,112px);pointer-events:none;opacity:0;transition:opacity .18s;will-change:transform;z-index:3;
    filter:drop-shadow(0 4px 6px rgba(43,29,20,.18))}
  #hand.on{opacity:.93}
  #bubble{position:absolute;left:50%;top:58px;transform:translate(-50%,-6px);max-width:82%;background:#FFFDF9;color:#2B1D14;
    border:2px solid #2B1D14;border-radius:18px;padding:7px 14px;font-weight:700;font-size:16px;line-height:1.25;text-align:center;
    opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:2}
  #bubble.on{opacity:1;transform:translate(-50%,0)}
  #toast{position:absolute;left:50%;top:12px;transform:translate(-50%,-8px);width:max-content;max-width:calc(100% - 28px);
    background:var(--toast-bg);color:var(--toast-ink);border-radius:14px;padding:9px 14px;font-size:15px;line-height:1.3;text-align:center;
    opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:4}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  #hint{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:rgba(255,253,249,.92);color:#2B1D14;border-radius:999px;
    padding:8px 16px;font-size:15px;font-weight:700;pointer-events:none;z-index:2;animation:pulse 1.6s ease-in-out infinite;white-space:nowrap}
  #hint.off{display:none}
  @keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.06)}}

  .coll{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px 12px 12px}
  .coll-head{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin:0 2px 8px}
  .coll-head b{color:var(--ink);font-size:15px}
  .coll-head .sp{flex:1}
  .link-btn{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:4px;touch-action:manipulation}
  .chips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .chip{aspect-ratio:1;width:100%;border-radius:50%;border:1px solid var(--line);background:var(--chip);font-size:20px;line-height:1;
    display:grid;place-items:center;cursor:pointer;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;color:var(--muted);font-family:inherit;font-weight:800}
  .chip.locked{background:var(--chip-locked);font-size:16px}
  .chip.now{box-shadow:0 0 0 3px var(--accent)}
  .chip.new{animation:pop .5s ease-out}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
  .tip{font-size:12.5px;color:var(--muted);text-align:center;margin:2px 4px 0;line-height:1.35}
  @media (prefers-reduced-motion: reduce){ #hint{animation:none} .chip.new{animation:none} }
</style>

    <div id="hint">Погладь Хамстера</div>
    <div id="toast" role="status" aria-live="polite"></div>
  </section>

  </section>
</main>

  el('ellipse', { rx:17, ry:16, fill:'#fff' }, open);
  const look = el('g', {}, open);
  el('circle', { r:11, fill:C.iris }, look);
  el('circle', { r:6.2, fill:'#151515' }, look);
  el('circle', { cx:3.6, cy:-4, r:3.2, fill:'#fff' }, look);
  el('circle', { cx:-4, cy:4, r:1.5, fill:'#fff', opacity:.85 }, look);
  const lidG = el('g', { 'clip-path':`url(#clip${id[0].toUpperCase()+id.slice(1)})` }, open);
  const lid = el('path', { fill:C.fur }, lidG);

function setEyeType(E, type){
  if (E.type === type) return;
  E.type = type;
  if (type === 'open'){ E.open.style.display = ''; E.alt.style.display = 'none'; return; }
  E.open.style.display = 'none'; E.alt.style.display = '';
  E.alt.setAttribute('d', EYE_ALT[type](E.side));
  if (type === 'heart'){ E.alt.setAttribute('fill', '#F0405B'); E.alt.setAttribute('stroke-width', 3); }
  else { E.alt.setAttribute('fill', 'none'); E.alt.setAttribute('stroke-width', 4.5); }
}
function setLid(E, amount, tilt){
  const rx = 17, ry = 16, base = -ry + clamp(amount, 0, 1) * 2 * ry;
  const yIn = base + tilt * 7, yOut = base - tilt * 3;
  const yL = E.side < 0 ? yOut : yIn, yR = E.side < 0 ? yIn : yOut;
  const mid = (yL + yR) / 2 + 3;
  E.lid.setAttribute('d', `M${-rx-5} ${-ry-9} H${rx+5} V${yR} Q0 ${mid} ${-rx-5} ${yL} Z`);
  E.lidLine.setAttribute('d', `M${-rx-5} ${yL} Q0 ${mid} ${rx+5} ${yR}`);
}

function drawLock(L){
  const lx = L.rx - L.w / 2, rx = L.rx + L.w / 2, tx = L.tx + L.bx, ty = L.ty + L.by;
  const c1x = lx + (tx - lx) * .3 + L.bx * .35 - 3, c1y = L.ry + (ty - L.ry) * .62;

  L.fill.setAttribute('d', `M${lx} ${L.ry} Q${c1x} ${c1y} ${tx} ${ty} Q${c2x} ${c2y} ${rx} ${L.ry} Z`);
  L.edge.setAttribute('d', `M${lx} ${L.ry + 14} Q${c1x} ${c1y} ${tx} ${ty} Q${c2x} ${c2y} ${rx} ${L.ry + 14}`);
  const sx = L.rx + 2, sy = L.ry + 10;

}

  const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2600; bp.Q.value = .7;
  const g = c.createGain(); g.gain.value = 0;

function tone(o){

  const g = c.createGain();
  g.gain.setValueAtTime(.0001, t0);
  g.gain.exponentialRampToValueAtTime(v, t0 + (o.a || .012));
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  let node = osc;
  if (o.lp){ const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; osc.connect(f); node = f; }
  if (o.trem){ const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.trem; lg.gain.value = v * .6; l.connect(lg); lg.connect(g.gain); l.start(t0); l.stop(t0 + dur + .05); }

  g.gain.exponentialRampToValueAtTime(o.vol || .1, t0 + (o.a || .02));

  if (collected.size === ORDER.length){
    toast(`Все ${ORDER.length} качеств собраны! Ты лучший друг Хамстера 🏆`, 4200);
    SFX.fanfare(); confetti();
  } else {
    toast(`Новое качество: ${M.e} ${M.name} · ${collected.size}/${ORDER.length}`);
    setTimeout(SFX.chime, 250);

}

/* ---------- частицы ---------- */
const parts = [];
function spawn(type, x, y, o = {}){
  let n;
  if (type === 'heart') n = el('path', { d:HEART, fill:o.color || '#F0405B', stroke:C.line, 'stroke-width':2 }, fx);
  else if (type === 'spark') n = el('path', { d:'M0 -10 L2.6 -2.6 L10 0 L2.6 2.6 L0 10 L-2.6 2.6 L-10 0 L-2.6 -2.6 Z', fill:o.color || '#FFD34D', stroke:C.line, 'stroke-width':1.6 }, fx);
  else if (type === 'steam') n = el('circle', { r:o.r || 9, fill:'#FFFFFF', stroke:'#C9C9C9', 'stroke-width':1.5 }, fx);
  else if (type === 'conf') n = el('rect', { x:-4, y:-7, width:8, height:14, rx:2, fill:o.color }, fx);
  else if (type === 'drop') n = el('path', { d:'M0 -9 C5 -2 7 2 7 5 C7 9 3 11 0 11 C-3 11 -7 9 -7 5 C-7 2 -5 -2 0 -9 Z', fill:'#8FD0FF', stroke:C.line, 'stroke-width':1.8 }, fx);
  else {
    n = el('text', { 'font-size':o.size || 24, 'font-weight':800, fill:o.color || C.line, 'text-anchor':'middle',
      'font-family':'ui-rounded, "SF Pro Rounded", system-ui, sans-serif', stroke:o.stroke || 'none', 'stroke-width':o.stroke ? 4 : 0, 'paint-order':'stroke' }, fx);
    n.textContent = o.text;
  }
  parts.push({ n, x, y, vx:o.vx || 0, vy:o.vy == null ? -40 : o.vy, g:o.g || 0, life:0, max:o.life || 1.2,
               rot:o.rot || 0, vr:o.vr || 0, s:o.s || 1, grow:o.grow || 0 });
  if (parts.length > 90){ const p = parts.shift(); p.n.remove(); }
}
function updateParts(dt){
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.life += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    const k = p.life / p.max;
    if (k >= 1){ p.n.remove(); parts.splice(i, 1); continue; }
    const op = k < .15 ? k / .15 : 1 - (k - .15) / .85;
    p.n.setAttribute('opacity', op.toFixed(3));
    p.n.setAttribute('transform', `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${p.rot.toFixed(1)}) scale(${(p.s * (1 + p.grow * k)).toFixed(3)})`);
  }
}
function confetti(){
  const cols = ['#F0405B','#FFD34D','#2E9E5E','#7F97AD','#E58A3A','#B07CF0'];
  for (let i = 0; i < 46; i++){
    spawn('conf', rnd(40, 360), rnd(-70, -20), { color:pick(cols), vx:rnd(-60, 60), vy:rnd(40, 140), g:180, life:rnd(1.8, 2.8), rot:rnd(0, 360), vr:rnd(-400, 400) });

}

/* ---------- смена настроения ---------- */
function enterMood(m, now){
  const prev = S.mood;
  S.mood = m; S.moodSince = now; S.fxT = 0;
  const M = MOODS[m];
  faceTargets(m);
  const eyeT = M.eye;
  setEyeType(eyes.L, eyeT);
  setEyeType(eyes.R, M.winkR ? 'happy' : M.oneOpen ? 'closed' : eyeT);
  setMouth(M.mouth);
  pawRelax.style.display = m === 'cool' ? 'none' : '';
  pawPeace.style.display = m === 'cool' ? '' : 'none';
  nowEl.textContent = `${M.e} ${M.name}`;
  markNowChip();
  if (M.say && (now - (S.lastSaid[m] || -1e9) > 5000)){ S.lastSaid[m] = now; say(pick(M.say)); }
  if (ENTER_SFX[m]) ENTER_SFX[m]();
  // эффекты на входе
  if (m === 'surprised'){ SP.bounce.v -= 320; spawn('text', 262, 40, { text:'!', size:40, color:'#E2452F', vy:-60, life:1 }); }
  if (m === 'cool'){ for (let i = 0; i < 3; i++) spawn('spark', 206 + rnd(-10, 30), 372 + rnd(-24, 24), { vy:rnd(-50, -20), vx:rnd(-20, 30), life:1, vr:120 }); }
  if (m === 'stylish'){
    LOCKS.forEach(L => { L.vx += rnd(-260, 260); L.vy += rnd(-200, 40); });
    spawn('text', 300, 40, { text:'фух', size:22, color:C.line, vy:-30, life:1.2 });
  }
  if (m === 'offended'){ spawn('steam', 186, 240, { r:4, vx:-70, vy:16, life:.6, grow:1.5 }); spawn('steam', 214, 240, { r:4, vx:70, vy:16, life:.6, grow:1.5 }); }
  if (m === 'grumpy') spawn('text', 270, 60, { text:'?!', size:26, color:C.line, vy:-30, life:1.1 });
  if (m === 'bored'){ S.nextYawn = now + 600; }
  if (prev === 'sleep') S.lastAct = now;
  unlock(m);
}
function setTrans(m, ms, now){ S.trans = m; S.transUntil = now + ms; if (S.mood !== m) enterMood(m, now); }

function chooseMood(now, stroking){
  const idle = (now - S.lastAct) / 1000;
  let m;
  if (S.anger >= .8){ S.trans = null; m = 'angry'; }
  else if (S.trans && now < S.transUntil) m = S.trans;
  else {
    S.trans = null;
    if (S.mood === 'sleep' && idle < 1){ setTrans('grumpy', 3200, now); return; }
    if (S.mood === 'angry' && S.anger > .3) m = 'angry';
    else if (S.mood === 'angry'){ if (!stroking){ setTrans('offended', 4500, now); return; } m = 'kind'; }
    else if (S.hairMess > 1){ S.hairMess = 0; setTrans('stylish', 2600, now); return; }
    else if (S.acc.belly > .9) m = 'laugh';
    else if (S.acc.ear > 1) m = 'bliss';
    else if (S.love >= 1 || (S.mood === 'love' && S.love > .6)) m = 'love';
    else if (S.acc.head > .7) m = 'kind';
    else if (S.acc.cheek > .5) m = 'cute';
    else if (S.started && idle > 24) m = 'sleep';
    else if (S.started && idle > 9) m = 'bored';
    else m = 'neutral';
    const sticky = ['kind','cute','laugh','bliss','love'];
    if (m === 'neutral' && sticky.includes(S.mood) && now - S.lastAct < 1400) m = S.mood;
  }
  if (m !== S.mood) enterMood(m, now);
}

/* ---------- где рука ---------- */
function inE(x, y, cx, cy, rx, ry){ const a = (x - cx) / rx, b = (y - cy) / ry; return a * a + b * b <= 1; }
function zoneAt(x, y){
  if (Math.hypot(x - 90, y - 92) < 34 || Math.hypot(x - 310, y - 92) < 34) return 'ear';
  if (Math.hypot(x - 200, y - 230) < 20) return 'nose';
  if (Math.hypot(x - 168, y - 393) < 25) return 'paw';
  const inHead = inE(x, y, 200, 182, 124, 112) || inE(x, y, 120, 230, 56, 50) || inE(x, y, 280, 230, 56, 50) || inE(x, y, 200, 112, 128, 72);
  if (inHead){
    if (y < 166) return 'hair';
    if (inE(x, y, 128, 240, 46, 36) || inE(x, y, 272, 240, 46, 36)) return 'cheek';
    return 'face';
  }
  if (y >= 280 && y < 345 && x > 140 && x < 260) return 'neck';
  if (y >= 296 && y < 470 && x > 56 && x < 344) return 'belly';
  if (y >= 470 && y < 556 && x > 98 && x < 302) return 'feet';
  return null;
}
function toSvg(cx, cy){
  const m = svg.getScreenCTM(); if (!m) return { x:200, y:200 };
  const pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy;
  const r = pt.matrixTransform(m.inverse()); return { x:r.x, y:r.y };
}

/* ---------- касания ---------- */
let handHideTimer = 0;
function placeHand(e){
  const r = stage.getBoundingClientRect();
  P.px = e.clientX - r.left; P.py = e.clientY - r.top;
}
function firstTouch(hideHint){
  S.started = true;
  if (hideHint) hintEl.classList.add('off');
}
function onMove(e, now){
  const p = toSvg(e.clientX, e.clientY);
  const dt = Math.max(.008, (now - P.t) / 1000);
  if (P.t){
    const ivx = (p.x - P.x) / dt, ivy = (p.y - P.y) / dt;
    P.vx = P.vx * .55 + ivx * .45; P.vy = P.vy * .55 + ivy * .45;
    P.speed = Math.hypot(P.vx, P.vy);
    const dist = Math.hypot(p.x - P.x, p.y - P.y);
    P.rub = P.rub * .75 + (dist / dt) * .25;
    if (dist > .4) P.lastMove = now;
    if (P.down) P.moved += dist;
  }
  P.x = p.x; P.y = p.y; P.t = now;
  P.zone = zoneAt(p.x, p.y);
  placeHand(e);
}
stage.addEventListener('pointerdown', e => {
  if (P.id !== null && P.id !== e.pointerId) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  P.id = e.pointerId; P.type = e.pointerType; P.down = true;
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  const now = clock();
  P.t = 0; onMove(e, now); P.t = now;
  P.downT = now; P.downX = P.x; P.downY = P.y; P.moved = 0; P.speed = 0; P.rub = 0; P.vx = P.vy = 0;
  audioInit(); firstTouch(true);
  clearTimeout(handHideTimer); hand.classList.add('on');
  if (P.zone) S.lastAct = now;
  e.preventDefault();
});
stage.addEventListener('pointermove', e => {
  if (P.id !== null && P.id !== e.pointerId) return;
  if (e.pointerType !== 'mouse' && !P.down) return;
  P.type = e.pointerType;
  if (e.pointerType === 'mouse'){ P.over = true; hand.classList.add('on'); }
  onMove(e, clock());
  if (P.zone && P.rub > 30 && e.pointerType === 'mouse') firstTouch(false);
});
function endPointer(e, cancelled){
  if (P.id !== e.pointerId) return;
  const now = clock();
  audioInit();
  const wasTap = !cancelled && P.down && now - P.downT < 320 && P.moved < 14;
  if (wasTap){ const z = zoneAt(P.downX, P.downY); if (z) onTap(z, now); }
  P.down = false; P.id = null;
  try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
  if (e.pointerType !== 'mouse'){
    clearTimeout(handHideTimer);
    if (wasTap) hand.classList.remove('on'); else handHideTimer = setTimeout(() => hand.classList.remove('on'), 650);
    P.zone = null;
  }
}
stage.addEventListener('pointerup', e => endPointer(e, false));
stage.addEventListener('pointercancel', e => endPointer(e, true));
stage.addEventListener('pointerleave', e => {
  if (e.pointerType === 'mouse'){ P.over = false; P.zone = null; hand.classList.remove('on'); }
});
stage.addEventListener('contextmenu', e => e.preventDefault());
stage.addEventListener('touchend', () => audioInit(), { passive:true });
document.addEventListener('visibilitychange', () => {
  if (!A.ctx) return;
  if (document.hidden) A.ctx.suspend(); else A.ctx.resume();
});

function onTap(z, now){
  S.lastAct = now;
  if (S.mood === 'sleep'){ setTrans('grumpy', 3200, now); return; }
  if (z === 'nose'){
    S.boops = S.boops.filter(t => now - t < 3500); S.boops.push(now);
    SFX.boop(); SP.squash.v += 2.2;
    if (S.boops.length >= 3) S.anger += .35;
    if (S.anger < .8) setTrans('surprised', 1300, now);
  } else if (z === 'paw'){
    setTrans('cool', 3000, now);
  } else if (z === 'cheek'){
    S.acc.cheek += .35; S.zoneT.cheek = now; SFX.squeak(1.25, 1);
    (P.downX < 200 ? SP.chL : SP.chR).v -= 3;
  } else if (z === 'ear'){
    (P.downX < 200 ? SP.earL : SP.earR).v += (P.downX < 200 ? -1 : 1) * 260; SFX.squeak(1.35, 1);
  } else if (z === 'belly' || z === 'neck'){
    SP.body.v += 2.4; SFX.puff(); if (z === 'belly'){ S.acc.belly += .25; S.zoneT.belly = now; }
  } else if (z === 'feet'){
    SP.bounce.v -= 260; SFX.squeak(.9, 1);
  } else {
    SP.squash.v += 2; SFX.pat(); S.acc.head += .2; S.zoneT.head = now; S.love += .03;
  }
}

/* ---------- главный цикл ---------- */
let last = clock();
const ZONE_ACC = { hair:'head', face:'head', neck:'head', nose:'head', ear:'ear', cheek:'cheek', belly:'belly', paw:'belly' };
function tick(){
  const now = clock();
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const t = now / 1000;

  if (now - P.lastMove > 90){ P.vx *= .8; P.vy *= .8; P.speed *= .8; P.rub *= .8; }
  const engaged = P.down || (P.type === 'mouse' && P.over);
  const stroking = engaged && !!P.zone && now - P.lastMove < 120 && P.rub > 30;
  const fast = stroking && P.rub > FAST;

  if (stroking){
    S.lastAct = now;
    const key = ZONE_ACC[P.zone];
    const rough = fast && (key === 'head' || key === 'cheek');
    if (key && !rough){ S.acc[key] += dt * (key === 'belly' && fast ? 2 : 1); S.zoneT[key] = now; if (key === 'ear') S.earSide = P.x < 200 ? -1 : 1; }
    if (fast){
      if (P.zone === 'hair'){ S.hairMess += dt; S.anger += .3 * dt; }
      else if (['face','cheek','neck','nose'].includes(P.zone)) S.anger += .7 * dt;
    } else if (P.zone !== 'feet') S.love = Math.min(1.05, S.love + .11 * dt);
    if (!fast) S.anger = Math.max(0, S.anger - .3 * dt);
  } else {
    S.anger = Math.max(0, S.anger - .12 * dt);
    S.love = Math.max(0, S.love - (S.mood === 'love' ? .15 : .03) * dt);
    S.hairMess = Math.max(0, S.hairMess - .4 * dt);
  }
  for (const k in S.acc) if (now - S.zoneT[k] > 600) S.acc[k] = Math.max(0, S.acc[k] - 1.5 * dt);
  S.anger = Math.min(1.2, S.anger);

  chooseMood(now, stroking);
  animate(dt, t, now, stroking);
}
function loop(){ tick(); requestAnimationFrame(loop); }

function animate(dt, t, now, stroking){
  const m = S.mood, M = MOODS[m];
  const k = 1 - Math.exp(-dt * 12);
  for (const key in F.tgt) F.cur[key] += (F.tgt[key] - F.cur[key]) * k;
  S.fxT += dt;

  /* зевок, моргание */
  let yawning = false;
  if (m === 'bored'){
    if (now > S.nextYawn && now > S.yawnUntil){ S.yawnUntil = now + 1400; S.nextYawn = now + rnd(4500, 6500); SFX.yawn(); }
    yawning = now < S.yawnUntil;
    setMouth(yawning ? 'yawn' : M.mouth);
  }
  S.blinkT += dt;
  if (S.blinkT > S.nextBlink){ S.blinkT = 0; S.nextBlink = rnd(2.2, 5); }
  const blink = S.blinkT < .14 ? Math.sin(S.blinkT / .14 * Math.PI) : 0;

  /* куда смотрит */
  let lx = 0, ly = 0;
  if (m === 'bored'){ lx = Math.sin(t * .9) * 6; ly = -2; }
  else if (m === 'offended'){ lx = -6; ly = -1; }
  else if (P.over || P.down || hand.classList.contains('on')){
    lx = clamp((P.x - 200) * .035, -6, 6); ly = clamp((P.y - 200) * .03, -5, 5);
  }
  const ps = F.cur.pupil;
  for (const s of ['L','R']){
    const E = eyes[s];
    if (E.type === 'open'){
      const lid = Math.max(s === 'L' ? F.cur.lidL : F.cur.lidR, blink) + (yawning ? .3 : 0);
      setLid(E, lid, s === 'L' ? F.cur.tiltL : F.cur.tiltR);
      E.look.setAttribute('transform', `translate(${lx.toFixed(2)} ${ly.toFixed(2)}) scale(${ps.toFixed(3)})`);
    } else if (E.type === 'heart'){
      E.alt.setAttribute('transform', `scale(${(1.05 + Math.sin(t * 9) * .12).toFixed(3)})`);
    } else E.alt.removeAttribute('transform');
  }
  setBrow(browL, -1, F.cur.bLdy, F.cur.bLt);
  setBrow(browR, 1, F.cur.bRdy, F.cur.bRt);
  blushL.setAttribute('opacity', F.cur.blush.toFixed(3)); blushR.setAttribute('opacity', F.cur.blush.toFixed(3));
  tintEl.setAttribute('opacity', F.cur.tint.toFixed(3));
  veinEl.setAttribute('opacity', (F.cur.tint / .3).toFixed(3));

  /* тело и пружины */
  let tiltT = 0, hxT = 0, bounceT = 0, jitter = 0, breathA = .007, breathR = 1.7, squashT = 0, bodyT = 0;
  if (m === 'kind' && stroking) tiltT = clamp((P.x - 200) * .05, -7, 7);
  if (m === 'offended'){ tiltT = -8; hxT = -10; }
  if (m === 'sleep'){ tiltT = 7; breathA = .016; breathR = .8; }
  if (m === 'bliss') tiltT = S.earSide * 6;
  if (m === 'laugh') bounceT = -Math.abs(Math.sin(t * 13)) * 8;
  if (m === 'angry') jitter = reduceMotion ? 0 : Math.sin(t * 70) * 2.4;
  if (m === 'love') tiltT = Math.sin(t * 2.2) * 4;
  if (P.down && P.zone && ['hair','face','nose','cheek','ear'].includes(P.zone)) squashT = .035;
  if (P.down && P.zone === 'belly') bodyT = .03;

  spring(SP.tilt, tiltT, 60, 12, dt);
  spring(SP.hx, hxT, 60, 12, dt);
  spring(SP.bounce, bounceT, 260, 18, dt);
  spring(SP.squash, squashT, 300, 14, dt);
  spring(SP.body, bodyT, 260, 10, dt);
  spring(SP.earL, 0, 220, 7, dt);
  spring(SP.earR, 0, 220, 7, dt);
  spring(SP.chL, 0, 260, 9, dt);
  spring(SP.chR, 0, 260, 9, dt);
  spring(SP.footL, 0, 400, 22, dt);
  spring(SP.footR, 0, 400, 22, dt);

  /* касание в движении */
  if (stroking){
    if (P.zone === 'ear'){ const e = P.x < 200 ? SP.earL : SP.earR; e.v += clamp(P.vx, -1500, 1500) * .45 * dt * 10; }
    if (P.zone === 'cheek'){ const c = P.x < 200 ? SP.chL : SP.chR; c.v -= .9 * dt * 10; }
    if (P.zone === 'belly'){ SP.body.v += (Math.random() - .5) * 10 * dt * 10; }
  }

  /* прядки */
  for (const L of LOCKS){
    if (stroking && (P.zone === 'hair' || P.zone === 'face' || P.zone === 'ear')){
      const mx = (L.rx + L.tx) / 2, my = (L.ry + L.ty) / 2, d = Math.hypot(P.x - mx, P.y - my);
      if (d < 75){ const f = 1 - d / 75; L.vx += clamp(P.vx, -1600, 1600) * f * 5 * dt; L.vy += clamp(P.vy, -1600, 1600) * f * 2.5 * dt; }
    }
    L.vx += (-140 * L.bx - 9 * L.vx) * dt; L.vy += (-140 * L.by - 9 * L.vy) * dt;
    L.bx = clamp(L.bx + L.vx * dt, -30, 30); L.by = clamp(L.by + L.vy * dt, -26, 10);
    drawLock(L);
  }

  /* эффекты по настроению */
  if (m === 'angry'){
    if (S.fxT > .14){ S.fxT = 0; spawn('steam', rnd(80, 100), 70, { r:rnd(6, 10), vx:rnd(-40, -10), vy:rnd(-90, -60), life:.9, grow:1.4 }); spawn('steam', rnd(300, 320), 70, { r:rnd(6, 10), vx:rnd(10, 40), vy:rnd(-90, -60), life:.9, grow:1.4 }); }
    if (now - S.moodSince > 300 && ((now - S.moodSince) % 1500) < dt * 1000) SFX.growl();
    if (Math.sin(t * 9) > .96){ SP.footL.v -= 120; }
  } else if (m === 'love'){
    if (S.fxT > .32){ S.fxT = 0; spawn('heart', rnd(110, 290), rnd(90, 160), { vy:rnd(-80, -50), vx:rnd(-20, 20), life:1.5, s:rnd(.8, 1.3), rot:rnd(-15, 15) }); }
  } else if (m === 'laugh'){
    if (S.fxT > .45){ S.fxT = 0; spawn('text', Math.random() < .5 ? rnd(40, 90) : rnd(310, 360), rnd(150, 230), { text:pick(['ха','хи','ха-ха']), size:rnd(20, 28), vy:-60, life:1, color:'#E58A3A', stroke:'#FFF9F0' }); SFX.laugh(); }
  } else if (m === 'sleep'){
    if (S.fxT > 1.2){ S.fxT = 0; spawn('text', 280, 70, { text:'Z', size:rnd(22, 32), color:'#6B7FA8', vx:20, vy:-38, life:2.2, grow:.6, stroke:'#FFF9F0' }); }
    if (((now - S.moodSince) % 2600) < dt * 1000 && now - S.moodSince > 1000) SFX.snore();
  } else if (m === 'bliss'){
    if (S.fxT > .45){ S.fxT = 0; SP.footR.v -= 140; SFX.thump(); spawn('heart', S.earSide < 0 ? 70 : 330, 60, { vy:-50, life:1.1, s:.7, color:'#FF8C9E' }); }
  } else if (m === 'kind'){
    if (S.fxT > 1.1){ S.fxT = 0; spawn('heart', rnd(130, 270), 70, { vy:-50, life:1.2, s:.7, color:'#FF8C9E' }); }
  } else if (m === 'cute'){
    if (S.fxT > .7){ S.fxT = 0; spawn('spark', pick([80, 320]) + rnd(-10, 10), rnd(210, 250), { vy:-30, life:.9, s:.8, vr:90 }); }
  } else if (m === 'cool'){
    if (S.fxT > .8){ S.fxT = 0; spawn('spark', 210 + rnd(-6, 20), 372 + rnd(-20, 20), { vy:-30, life:.8, s:.7, vr:120 }); }
  } else if (m === 'bored'){
    if (S.fxT > 3.5){ S.fxT = 0; if (Math.random() < .5) spawn('drop', 300, 150, { vy:30, g:60, life:1.2, s:.8 }); }
  }

  /* сопение носом */
  const sniffing = m === 'neutral' || m === 'cute' || m === 'surprised' || (stroking && P.zone === 'nose');
  const sniff = sniffing ? Math.max(0, Math.sin(t * 2.3)) * Math.sin(t * 34) * .06 : 0;
  noseG.setAttribute('transform', `translate(200 230) scale(${(1 + sniff).toFixed(3)} ${(1 - sniff).toFixed(3)}) translate(-200 -230)`);
  whiskG.setAttribute('transform', `translate(0 ${(sniff * 18).toFixed(2)})`);

  /* применяем */
  const breath = Math.sin(t * breathR * Math.PI) * breathA;
  hamG.setAttribute('transform', `translate(${jitter.toFixed(2)} ${SP.bounce.x.toFixed(2)}) translate(200 548) scale(${(1 - breath * .4).toFixed(4)} ${(1 + breath).toFixed(4)}) translate(-200 -548)`);
  const sq = clamp(SP.squash.x, -.12, .12);
  headG.setAttribute('transform', `translate(${SP.hx.x.toFixed(2)} 0) rotate(${SP.tilt.x.toFixed(2)} 200 300) translate(200 292) scale(${(1 + sq * .6).toFixed(4)} ${(1 - sq).toFixed(4)}) translate(-200 -292)`);
  const bs = clamp(SP.body.x, -.1, .1);
  bodyG.setAttribute('transform', `translate(200 464) scale(${(1 + bs * .6).toFixed(4)} ${(1 - bs).toFixed(4)}) translate(-200 -464)`);
  earL.setAttribute('transform', `rotate(${clamp(SP.earL.x, -28, 28).toFixed(2)} 104 112)`);
  earR.setAttribute('transform', `rotate(${clamp(SP.earR.x, -28, 28).toFixed(2)} 296 112)`);
  const ch = F.cur.cheek;
  const cL = clamp(SP.chL.x, -.2, .2), cR = clamp(SP.chR.x, -.2, .2);
  const tL = `translate(120 230) scale(${(ch + cL).toFixed(4)} ${(ch - cL * .5).toFixed(4)}) translate(-120 -230)`;
  const tR = `translate(280 230) scale(${(ch + cR).toFixed(4)} ${(ch - cR * .5).toFixed(4)}) translate(-280 -230)`;
  cheekEls.L.forEach(e => e.setAttribute('transform', tL)); cheekEls.R.forEach(e => e.setAttribute('transform', tR));
  shoeL.setAttribute('transform', `translate(0 ${clamp(SP.footL.x * .08, -12, 0).toFixed(2)})`);
  shoeR.setAttribute('transform', `translate(0 ${clamp(SP.footR.x * .08, -12, 0).toFixed(2)})`);

  /* шорох шерсти */
  if (A.rustle && A.ctx){
    const v = stroking && P.zone !== 'feet' ? Math.min(1, P.rub / 1400) * .075 : 0;
    A.rustle.gain.setTargetAtTime(v, A.ctx.currentTime, .05);
  }

  /* рука */
  if (hand.classList.contains('on')){
    const rot = clamp(P.vx * .008, -14, 14), sc = P.down ? .95 : 1;
    hand.style.transform = `translate(${P.px.toFixed(1)}px, ${P.py.toFixed(1)}px) translate(-50%, -72%) rotate(${rot.toFixed(1)}deg) scale(${sc})`;
  }

  updateParts(dt);
}

/* ---------- старт ---------- */
faceTargets('neutral');
for (const k in F.tgt) F.cur[k] = F.tgt[k];
setEyeType(eyes.L, 'open'); setEyeType(eyes.R, 'open'); setMouth('smirk');
renderChips(); renderSound();
requestAnimationFrame(loop);

/* для проверки в консоли: hamster.state() */
window.hamster = {
  advance(ms){ for (let i = 0; i < Math.ceil(ms / 16); i++){ clockOff += 16; tick(); } },
  state:() => ({ mood:S.mood, anger:+S.anger.toFixed(2), love:+S.love.toFixed(2), audio:A.ctx ? A.ctx.state : 'нет', collected:[...collected] }) };
})();
</script>
</body>
